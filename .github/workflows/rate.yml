name: Курс ПриватБанку
on:
  schedule:
    # 9:05 за Києвом і взимку (UTC+2), і влітку (UTC+3); зайві запуски скрипт пропускає
    - cron: '5 6,7,8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Оновити rate.json
        run: python tools/rate.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Зберегти
        run: |
          if git diff --quiet -- rate.json; then echo "без змін"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rate.json
          git commit -m "Курс ПриватБанку на $(TZ=Europe/Kyiv date +%d.%m.%Y)"
          git push
